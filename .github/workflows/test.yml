name: Tests

on:
  push:
    branches:
      - master
  pull_request:


jobs:
  msrv:
    name: Run tests on MSRV
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v2
      - name: Install the MSRV toolchain
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          echo "MSRV is ${msrv}"
          rustup toolchain install "${msrv}" --profile minimal
          echo "MSRV=${msrv}" >> "${GITHUB_ENV}"
      - name: Run tests
        run: cargo +${MSRV} test --all
  stable:
    name: Run tests on stable rust
    runs-on: ubuntu-latest
    steps:
      - name: Get latest stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Check out source
        uses: actions/checkout@v2
      - name: Run tests
        run: cargo test --all
  beta:
    name: Run tests on beta rust
    runs-on: ubuntu-latest
    steps:
      - name: Get latest beta Rust
        run: rustup toolchain install beta --profile minimal
      - name: Check out source
        uses: actions/checkout@v2
      - name: Run tests
        run: cargo test --all
  nightly:
    name: Run tests on nightly rust
    runs-on: ubuntu-latest
    steps:
      - name: Get latest nightly Rust
        run: rustup toolchain install nightly --profile minimal
      - name: Check out source
        uses: actions/checkout@v2
      - name: Run tests
        run: cargo test --all
